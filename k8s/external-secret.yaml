apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: airline-database
  namespace: airline
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: aws-secrets-manager
    kind: ClusterSecretStore
  target:
    name: airline-database
    creationPolicy: Owner
  data:
    - secretKey: DATABASE_URL
      remoteRef:
        key: airline-devops-lab/database
        property: database_url
